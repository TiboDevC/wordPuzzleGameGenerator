# GPIO support
CONFIG_GPIO=y

# SPI support for e-ink display
CONFIG_SPI=y

# Display drivers
CONFIG_DISPLAY=y
CONFIG_DISPLAY_LOG_LEVEL_DBG=y

# UC8179 E-Ink display driver
CONFIG_UC81XX=y

# C++ support
CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_NEWLIB_LIBC=y

# Console/logging
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Heap for C++
CONFIG_HEAP_MEM_POOL_SIZE=32768

# Enable NVS for settings persistence
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
